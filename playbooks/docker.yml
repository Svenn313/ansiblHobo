---
- name: cloudHobo configuration and installation
  hosts: linux
  become: true
  roles:
    - geerlingguy.docker
  tasks:
    - name: Clone cloudHobo repositories
      ansible.builtin.git:
        repo: "git@github.com:Svenn313/CloudHobo.git"
        dest: "/tmp/cloudHobo"
        key_file: "/home/{{ linux_user }}/.ssh/cloudhoboKey"
      become_user: "{{ linux_user }}"

    - name: Copy and decrypt tarball
      ansible.builtin.copy:
        src: "{{ files_dir }}/vault/sensitive_configs.tar.gz.vault"
        dest: /tmp/sensitive_configs.tar.gz
        decrypt: yes

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: /tmp/sensitive_configs.tar.gz
        dest: /tmp/cloudHobo/
        remote_src: yes
    
    - name: Delete tarball once extracted
      ansible.builtin.file:
        state: absent
        path: /tmp/sensitive_configs.tar.gz

    - name: Delete tmp once finished
      ansible.builtin.file:
        state: absent
        path: /tmp/cloudHobo/

    - name: Deploy backup restic script
      ansible.builtin.template:
        src: "/home/{{ linux_user }}/git/ansiblHobo/scripts/restic.sh.j2"
        dest: "/home/{{ linux_user }}/git/cloudHobo/backup.sh"
        owner: "{{ linux_user }}"
        mode: "0755"
